# Everything needed to run HomeSync locally: clone the repo and `docker compose
# up`. The bind mounts are relative, so no host path has to be prepared first.
services:
  homesync:
    build:
      context: ./server
      args:
        # Left as "local"; CI passes the release tag when it builds the
        # published image.
        VERSION: ${HOMESYNC_VERSION:-local}
    container_name: homesync
    ports:
      - "${HOMESYNC_PORT:-8420}:8080"
    volumes:
      - ${HOMESYNC_DATA:-./data}:/data
      - ${HOMESYNC_CONFIG:-./config}:/config
      # What the backup copies. Mounted here and nowhere named in the
      # environment: /backup-source is the convention, and the mount is the
      # only place that decides what it holds. It defaults to the synced files,
      # which is the obvious thing to back up when nothing else is nominated.
      - ${HOMESYNC_BACKUP_SOURCE:-${HOMESYNC_DATA:-./data}}:/backup-source:ro
      # Where the snapshots go. In a real install a separate disk — the whole
      # point is that it survives the one the data is on — so point
      # HOMESYNC_BACKUP at its mountpoint.
      - ${HOMESYNC_BACKUP:-./backup}:/backup
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TRASH_DAYS=${TRASH_DAYS:-30}
      - TOMBSTONE_DAYS=${TOMBSTONE_DAYS:-90}
      - RESCAN_INTERVAL=${RESCAN_INTERVAL:-15m}
      # Encrypt file contents at rest. Generate one with:
      #   docker compose run --rm homesync key generate
      # Without it the volume holds plaintext, which is the default.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Set a password to enable the web admin UI at http://localhost:8420/
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Serves the admin UI with no login at all. Everything it can do is then
      # open to anyone who can reach the port.
      - ADMIN_NO_AUTH=${ADMIN_NO_AUTH:-}
      # Backups. Where they read from and write to is the two mounts above,
      # not a setting — the admin page shows those paths without offering to
      # edit them. Only the marker is named here, because it has to match a
      # file that exists on the actual disk.
      - BACKUP_MARKER=${BACKUP_MARKER:-.homesync_backup_disk}
      # Whether backups run, when, and how much history to keep are set on the
      # admin page. These seed the first start and nothing after it.
      - BACKUP_ENABLED=${BACKUP_ENABLED:-false}
      - "BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
