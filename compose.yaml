# Everything needed to run HomeSync locally: clone the repo and `docker compose
# up`. The bind mounts are relative, so no host path has to be prepared first.
services:
  homesync:
    build: ./server
    container_name: homesync
    ports:
      - "${HOMESYNC_PORT:-8420}:8080"
    volumes:
      - ${HOMESYNC_DATA:-./data}:/data
      - ${HOMESYNC_CONFIG:-./config}:/config
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TRASH_DAYS=${TRASH_DAYS:-30}
      - TOMBSTONE_DAYS=${TOMBSTONE_DAYS:-90}
      - RESCAN_INTERVAL=${RESCAN_INTERVAL:-15m}
      # Encrypt file contents at rest. Generate one with:
      #   docker compose run --rm homesync key generate
      # Without it the volume holds plaintext, which is the default.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Set a password to enable the web admin UI at http://localhost:8420/
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Serves the admin UI with no login at all. Everything it can do is then
      # open to anyone who can reach the port.
      - ADMIN_NO_AUTH=${ADMIN_NO_AUTH:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
