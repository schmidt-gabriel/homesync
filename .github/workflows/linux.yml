name: Linux client

# Scoped to what this workflow validates. The server is included because the
# conformance job runs the client against a real one, so a server change can
# genuinely break this even when no client file moved.
on:
  push:
    branches: [main]
    paths:
      - 'clients/linux/**'
      - 'conformance/**'
      - 'server/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'clients/linux/**'
      - 'conformance/**'
      - 'server/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            clients/linux/go.sum
            conformance/go.sum

      - name: Check formatting
        working-directory: clients/linux
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: clients/linux
        run: go vet ./...

      # -race because the watcher, the event stream and the poll timer all
      # ask for a cycle from different goroutines.
      - name: Unit tests
        working-directory: clients/linux
        run: go test -race ./...

      # No cgo anywhere in the client, so this is a plain cross-compile and
      # worth checking: a Raspberry Pi is the likeliest place for this to run.
      - name: Cross-compile
        working-directory: clients/linux
        run: |
          for arch in amd64 arm64 arm; do
            GOOS=linux GOARCH=$arch go build -o /dev/null ./... || exit 1
            echo "linux/$arch ok"
          done

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            clients/linux/go.sum
            conformance/go.sum

      - name: Build the client
        working-directory: clients/linux
        run: go build -o "${{ runner.temp }}/homesync-client" ./cmd/homesync-client

      - name: Build the server image
        run: docker compose build

      # Docker creates a missing bind-mount source as root, but the container
      # runs unprivileged as uid 1000 and could not then write to it.
      - name: Prepare the volumes
        run: |
          mkdir -p data/linux config
          chmod -R 777 data config

      - name: Start the server
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8420/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          docker compose logs
          exit 1

      - name: Register a device
        run: |
          TOKEN=$(docker compose exec -T homesync homesync device add linux linux \
            | grep -oE '[A-Za-z0-9_-]{43}')
          if [ -z "$TOKEN" ]; then
            echo "could not register a device"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HOMESYNC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # The suite that actually decides whether this is a HomeSync client: the
      # real binary, a real server, both directions, deletions, ignore rules
      # and conflicts.
      - name: Client conformance
        working-directory: conformance
        env:
          HOMESYNC_URL: http://localhost:8420
          HOMESYNC_SCOPE: linux
          HOMESYNC_CLIENT_CMD: ${{ runner.temp }}/homesync-client
        run: go test -v -run TestClientConformance ./...

      - name: Server logs
        if: failure()
        run: docker compose logs

      - name: Stop the server
        if: always()
        run: docker compose down -v
