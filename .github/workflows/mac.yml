name: macOS client

# Scoped to the client. conformance/ is included because the client
# conformance job runs that suite against the headless binary.
#
# Releases are not here: a tag carries no changed paths of its own, so a
# filtered trigger would never fire for one. release.yml handles tags, and
# builds its own bundle so it can stamp the tag into it.
on:
  push:
    branches: [main]
    paths:
      - 'clients/mac/**'
      - 'conformance/**'
      - '.github/workflows/mac.yml'
  pull_request:
    paths:
      - 'clients/mac/**'
      - 'conformance/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the sync engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Recorded on every run: when a build starts behaving differently, the
      # toolchain version is the first thing worth knowing.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # This is where the real coverage lives. The engine is a plain Swift
      # package with no UI and no bundle, so it tests without Xcode, without
      # signing, and in seconds.
      #
      # Without a server the engine's integration tests skip themselves, so one
      # is started for them. Docker is not available on the macOS runners, but
      # it is not needed: the server is a Go binary and the runner has Go.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Start a server
        run: |
          go build -o /tmp/homesync ./cmd/homesync
          export DATA_DIR=/tmp/homesync-data CONFIG_DIR=/tmp/homesync-config
          TOKEN=$(/tmp/homesync device add ci | grep -oE '[A-Za-z0-9_-]{43}')
          LISTEN_ADDR=127.0.0.1:8420 /tmp/homesync serve &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8420/healthz >/dev/null && break
            sleep 1
          done
          echo "::add-mask::$TOKEN"
          echo "HOMESYNC_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "HOMESYNC_TEST_URL=http://127.0.0.1:8420" >> "$GITHUB_ENV"
        working-directory: server

      - name: Unit and integration tests
        working-directory: clients/mac/HomeSyncKit
        run: swift test

  conformance:
    name: Client conformance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: conformance/go.sum

      # Proves the engine against the same contract any other client would have
      # to meet, driving the headless CLI end to end: real FSEvents, a real
      # event stream, a real server. The harness builds and launches the server
      # itself, so this needs no Docker.
      - name: Build the headless client
        working-directory: clients/mac/HomeSyncKit
        run: swift build -c release --product homesync-cli

      - name: Run the client conformance suite
        working-directory: conformance
        run: |
          BIN="$GITHUB_WORKSPACE/clients/mac/HomeSyncKit/.build/release/homesync-cli"
          HOMESYNC_CLIENT_CMD="$BIN" go test -v -run TestClientConformance ./...

  app:
    name: Build the app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: clients/mac
        # CODE_SIGNING_ALLOWED=NO because the runner holds no Developer ID
        # certificate. The artifact is therefore unsigned: see the note below.
        #
        # No version is stamped here. This build is not a release and must not
        # claim to be one, so it keeps the project's own value; release.yml
        # stamps the tag into the bundle it publishes.
        run: |
          build_once() {
            xcodebuild \
              -project HomeSync.xcodeproj \
              -scheme HomeSync \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
              build
          }

          # actool crashes on the .icon file every so often, with an internal
          # NSArray exception rather than anything wrong in the asset: the same
          # commit built on the previous run and again on a retry. Left alone
          # it turns publishing a release into a coin flip, so a failure is
          # retried once from a clean derived data directory before being
          # believed.
          if ! build_once; then
            echo "::warning::build failed, retrying once from a clean state"
            rm -rf build
            build_once
          fi

      - name: Package
        working-directory: clients/mac
        run: |
          APP=build/Build/Products/Release/HomeSync.app
          if [ ! -d "$APP" ]; then
            echo "no app bundle at $APP"
            exit 1
          fi
          # ditto rather than zip: it preserves the bundle's symlinks and
          # resource forks, which a plain zip mangles.
          ditto -c -k --sequesterRsrc --keepParent "$APP" HomeSync.zip

      # Before uploading, so a broken bundle is never published as if it were
      # good. ditto to unpack, matching how it was packed.
      - name: Verify the artifact
        working-directory: clients/mac
        run: |
          rm -rf verify && mkdir verify
          ditto -x -k HomeSync.zip verify
          test -x verify/HomeSync.app/Contents/MacOS/HomeSync
          # A menu bar app that lost LSUIElement would come back with a Dock
          # icon and a stray window, which is a silent regression otherwise.
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' verify/HomeSync.app/Contents/Info.plist)" = "true"
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' verify/HomeSync.app/Contents/Info.plist)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HomeSync-app
          path: clients/mac/HomeSync.zip
          if-no-files-found: error

  # The artifact this workflow produces is unsigned and unnotarised, so macOS
  # quarantines it on download and Gatekeeper refuses to open it. To run it:
  #
  #   xattr -dr com.apple.quarantine HomeSync.app
  #
  # Signing it properly needs a paid Apple Developer account. When there is
  # one, the certificate and notarisation credentials go in as secrets and a
  # signing step slots in before Package; nothing else here has to change.
