name: CLI client

# Scoped to what this workflow validates. The server is included because the
# conformance job runs the client against a real one, so a server change can
# genuinely break this even when no client file moved.
on:
  push:
    branches: [main]
    paths:
      - 'clients/cli/**'
      - 'conformance/**'
      - 'server/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'clients/cli/**'
      - 'conformance/**'
      - 'server/**'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            clients/cli/go.sum
            conformance/go.sum

      - name: Check formatting
        working-directory: clients/cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: clients/cli
        run: go vet ./...

      # -race because the watcher, the event stream and the poll timer all
      # ask for a cycle from different goroutines.
      - name: Unit tests
        working-directory: clients/cli
        run: go test -race ./...

      # No cgo anywhere in the client, so this is a plain cross-compile. The
      # list is what the name claims: every target it is said to run on gets
      # built here, or the claim is only a directory name. Windows is absent
      # because SIGUSR1 does not exist there — see the README.
      - name: Cross-compile
        working-directory: clients/cli
        run: |
          for target in linux/amd64 linux/arm64 linux/arm \
                        darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./... || exit 1
            echo "$target ok"
          done

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            clients/cli/go.sum
            conformance/go.sum

      - name: Build the client
        working-directory: clients/cli
        run: go build -o "${{ runner.temp }}/homesync-client" ./cmd/homesync-client

      - name: Build the server image
        run: docker compose build

      # Docker creates a missing bind-mount source as root, but the container
      # runs unprivileged as uid 1000 and could not then write to it.
      - name: Prepare the volumes
        run: |
          mkdir -p data/cli config
          chmod -R 777 data config

      - name: Start the server
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8420/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          docker compose logs
          exit 1

      - name: Register a device
        run: |
          TOKEN=$(docker compose exec -T homesync homesync device add cli cli \
            | grep -oE '[A-Za-z0-9_-]{43}')
          if [ -z "$TOKEN" ]; then
            echo "could not register a device"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HOMESYNC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # The suite that actually decides whether this is a HomeSync client: the
      # real binary, a real server, both directions, deletions, ignore rules
      # and conflicts.
      - name: Client conformance
        working-directory: conformance
        env:
          HOMESYNC_URL: http://localhost:8420
          HOMESYNC_SCOPE: cli
          HOMESYNC_CLIENT_CMD: ${{ runner.temp }}/homesync-client
        run: go test -v -run TestClientConformance ./...

      - name: Server logs
        if: failure()
        run: docker compose logs

      - name: Stop the server
        if: always()
        run: docker compose down -v
