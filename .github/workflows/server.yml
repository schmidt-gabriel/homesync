name: Server

# Scoped to what this workflow actually validates, so a change to the Mac
# client does not spend runner time rebuilding a container that cannot have
# been affected. conformance/ is included because it is what proves the
# server, and compose.yaml because the container job runs it.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'conformance/**'
      - 'compose.yaml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'conformance/**'
      - 'compose.yaml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            server/go.sum
            conformance/go.sum

      - name: Check formatting
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      # -race matters here: the index is written by HTTP handlers, the
      # filesystem watcher and the janitor at the same time.
      - name: Unit tests
        working-directory: server
        run: go test -race ./...

      # Runs the suite against a server it builds and launches itself, which is
      # the mode a contributor gets from a bare `go test ./...`.
      - name: Conformance (local build)
        working-directory: conformance
        run: go test -v ./...

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: conformance/go.sum

      - name: Build the image
        run: docker compose build

      # Docker creates a missing bind-mount source as root, but the container
      # runs unprivileged as uid 1000, so it would be unable to write. Creating
      # the directories up front avoids that.
      #
      # The device's scope directory is created here too. The container would
      # otherwise create it owned by uid 1000, and the checks that write
      # straight into the volume run as the runner's user, which could not
      # write there.
      - name: Prepare the volumes
        run: |
          mkdir -p data/ci config
          chmod -R 777 data config

      - name: Start the server
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8420/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          docker compose logs
          exit 1

      # The scope is passed explicitly rather than left to the default, so it
      # cannot drift from HOMESYNC_SCOPE below. The suite needs to know it: a
      # device only sees inside its own subtree, so the checks that write
      # straight into the volume have to land there to be visible at all.
      - name: Register a device
        run: |
          TOKEN=$(docker compose exec -T homesync homesync device add ci ci \
            | grep -oE '[A-Za-z0-9_-]{43}')
          if [ -z "$TOKEN" ]; then
            echo "could not register a device"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "HOMESYNC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # The same suite, now pointed at the artifact that would actually be
      # deployed rather than at a freshly compiled binary. HOMESYNC_DATA_DIR
      # lets it also verify that writes made straight into the volume are
      # picked up; without it those checks skip instead of silently passing.
      - name: Conformance (built image)
        working-directory: conformance
        env:
          HOMESYNC_URL: http://localhost:8420
          HOMESYNC_DATA_DIR: ${{ github.workspace }}/data
          HOMESYNC_SCOPE: ci
        run: go test -v ./...

      - name: Server logs
        if: failure()
        run: docker compose logs

      - name: Stop the server
        if: always()
        run: docker compose down -v

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    # Only after both checks pass, and never from a pull request: a fork's PR
    # must not be able to push an image under this repository's name.
    needs: [test, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 matters here: a Raspberry Pi or an Apple-silicon host would
      # otherwise have to emulate, or build the image itself.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # So the admin page names the release the image came from, rather
          # than reporting every published build as "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
